/* sun and ligght */
  :root {
    --day-sky-1: #7ec8e3;
    --day-sky-2: #ffe4a1;
    --night-sky-1: #0b1026;
    --night-sky-2: #1b2a4a;
    --sun-color: #ffb703;
    --moon-color: #e2e8f0;
    --track-shadow: rgba(0,0,0,0.25);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 30% 20%, #2b2f45, #14162a 70%);
    transition: background 0.6s ease;
  }

  body.day {
    background: radial-gradient(circle at 30% 20%, #bfe9ff, #7ec8e3 70%);
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .label {
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #f5f5f5;
    opacity: 0.85;
    transition: color 0.6s ease;
  }

  body.day .label { color: #14162a; }

  .toggle {
    --w: 140px;
    --h: 64px;
    --pad: 6px;
    width: var(--w);
    height: var(--h);
    border: none;
    border-radius: 999px;
    position: relative;
    cursor: pointer;
    padding: 0;
    background: linear-gradient(135deg, var(--night-sky-1), var(--night-sky-2));
    box-shadow: inset 0 2px 6px var(--track-shadow), 0 6px 18px rgba(0,0,0,0.35);
    transition: background 0.6s ease;
    overflow: hidden;
  }
.toggle.day {
    background: linear-gradient(135deg, var(--day-sky-1), var(--day-sky-2));
  }
 .stars {
    position: absolute;
    inset: 0;
    opacity: 1;
    transition: opacity 0.5s ease;
  }
  .toggle.day .stars { opacity: 0; }
  .stars span {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
  }

  .clouds {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .toggle.day .clouds { opacity: 1; }
  .clouds span {
    position: absolute;
    background: rgba(255,255,255,0.8);
    border-radius: 999px;
  }

  .knob {
    position: absolute;
    top: var(--pad);
    left: var(--pad);
    width: calc(var(--h) - var(--pad) * 2);
    height: calc(var(--h) - var(--pad) * 2);
    border-radius: 50%;
    background: var(--moon-color);
    box-shadow: 0 3px 8px rgba(0,0,0,0.4), inset -4px -4px 0 rgba(0,0,0,0.08);
    transition: transform 0.5s cubic-bezier(.68,-0.4,.27,1.4), background 0.5s ease, box-shadow 0.5s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .toggle.day .knob {
    transform: translateX(calc(var(--w) - var(--h)));
    background: var(--sun-color);
    box-shadow: 0 0 18px 4px rgba(255,183,3,0.7), inset -3px -3px 0 rgba(255,255,255,0.3);
  }

  .knob svg {
    width: 60%;
    height: 60%;
    transition: transform 0.5s ease;
  }

  .toggle:not(.day) .knob svg.moon-icon { opacity: 1; transform: rotate(0deg); }
  .toggle:not(.day) .knob svg.sun-icon { opacity: 0; position: absolute; }
  .toggle.day .knob svg.sun-icon { opacity: 1; transform: rotate(90deg); }
  .toggle.day .knob svg.moon-icon { opacity: 0; position: absolute; }

  .knob svg { position: absolute; opacity: 0; }
  .knob svg.moon-icon { opacity: 1; }
</style>
